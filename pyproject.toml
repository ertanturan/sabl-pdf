[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sabl-pdf"
version = "1.0.2"
description = "A simple, offline PDF desktop application for Windows"
requires-python = ">=3.12"
dependencies = ["PyMuPDF>=1.25,<2", "PySide6>=6.8,<7", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9", "pyright>=1.1.400,<2", "pyinstaller>=6.11"]

[project.scripts]
simple-pdf = "sabl_pdf.main:main"
sabl-pdf = "sabl_pdf.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
ignore = [
    "src/sabl_pdf/services/conversion.py",
    "src/sabl_pdf/services/forms.py",
    "src/sabl_pdf/services/ocr.py",
    "src/sabl_pdf/services/placed_items.py",
    "src/sabl_pdf/services/signatures.py",
    "src/sabl_pdf/services/text_boxes.py",
    "src/sabl_pdf/services/viewer.py",
    "src/sabl_pdf/ui/annotation_actions.py",
    "src/sabl_pdf/ui/canvas.py",
    "src/sabl_pdf/ui/compression_actions.py",
    "src/sabl_pdf/ui/conversion_actions.py",
    "src/sabl_pdf/ui/ocr_actions.py",
    "src/sabl_pdf/ui/page_actions.py",
    "src/sabl_pdf/ui/signature_actions.py",
    "src/sabl_pdf/ui/text_actions.py",
    "src/sabl_pdf/ui/viewer_actions.py",
    "src/sabl_pdf/ui/window.py",
]
