name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Bundle English OCR data
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer/tessdata
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata' -OutFile 'installer/tessdata/eng.traineddata'
      - name: Build executable
        shell: powershell
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SABL-PDF-Setup
          path: dist/installer/*.exe
