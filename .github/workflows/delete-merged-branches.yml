name: Delete merged branches
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete eligible merged branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const current = await github.rest.repos.get({ owner, repo })
            const defaultBranch = current.data.default_branch
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            })
            const closed = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', per_page: 100
            })
            const upstream = new Set(open.map(pr => pr.base.ref))
            const activeHeads = new Set(open.map(pr => pr.head.ref))
            for (const pr of closed) {
              const branch = pr.head.ref
              if (!pr.merged_at || pr.head.repo?.full_name !== `${owner}/${repo}`) continue
              if (branch === defaultBranch || upstream.has(branch) || activeHeads.has(branch)) continue
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` })
                core.info(`Deleted merged branch: ${branch}`)
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) throw error
              }
            }
